services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polling_system_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_HOSTS=*
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
